
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Booking | Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(135deg, #102a43, #176b87, #64b6ac);
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 46px);
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.8;
            color: #e6f4f5;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            margin-bottom: 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.16);
            font-size: 14px;
            letter-spacing: 1px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 10px;
            background: #ffffff;
            color: #176b87;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

            .button:hover {
                background: #dff6f4;
                transform: translateY(-3px);
            }

        footer {
            margin-top: 35px;
            font-size: 13px;
            color: #d4eeee;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🚧</div>

        <div class="status">UNDER CONSTRUCTION</div>

        <h1>Something Great Is Coming!</h1>

        <p>
            Our website is currently under development.
            We are working hard to bring you a better experience.
            Stay tuned!
        </p>

        <a class="button"
           href="https://alextechboxclinic.runasp.net/swagger"
           target="_blank"
           rel="noopener noreferrer">
            Explore Our API
        </a>

        <footer>
            &copy; 2026 Clinic Booking. All rights reserved.
        </footer>
    </main>
</body>
</html>
